name: Android app
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["ios/**", "docs/**", "*.md"]
  pull_request:
    paths: ["android/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ADBLOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test and build
        env:
          ADBLOCK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ADBLOCK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ADBLOCK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../AdBlock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AdBlock-apk
          path: AdBlock.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AdBlock.apk
